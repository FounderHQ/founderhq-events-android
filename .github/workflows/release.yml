name: SDK release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(ruby -rjson -e 'print JSON.parse(File.read("release-manifest.json")).fetch("version")')
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build both Android libraries
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --max-workers=2 --console=plain
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish signed Maven Central artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME" && test -n "$MAVEN_CENTRAL_PASSWORD"
          test -n "$MAVEN_SIGNING_KEY" && test -n "$MAVEN_SIGNING_PASSWORD"
          ./scripts/publish.sh
      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true
            });
